<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>码一下 QR</title></head><body><main id="app" class="result"><header><span class="logo">▦</span><div><h1>码一下 QR</h1><p id="subtitle">二维码识别与生成</p></div></header><div id="status" role="status"></div><section id="scan-section" hidden><h2>识别二维码</h2><p id="scan-help" class="hint"></p><div id="image-wrap"><img id="source-image" alt="等待识别的截图"><div id="selection"></div></div><div class="row"><button id="scan-all">识别整张图</button><button id="choose-file">换一张图片</button><input id="file" type="file" accept="image/*" hidden></div><div id="decoded"></div></section><section id="generate-section" hidden><h2>生成二维码</h2><label for="content">网址或文字</label><textarea id="content" rows="3"></textarea><div class="row"><button id="regenerate" class="primary">重新生成</button></div><canvas id="qr-canvas" aria-label="生成的二维码"></canvas><div class="row"><button id="copy-image">复制图片</button><button id="download">下载 PNG</button></div></section><footer>所有图片与内容仅在此浏览器本地处理</footer></main><script type="module" src="/src/result.js"></script></body></html>
